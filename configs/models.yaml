# Mọi thành phần thay được bằng cách sửa file này, không cần sửa code.
paths:
  data_dir: data            # tương đối so với thư mục dự án

ingest:
  max_duration_s: 7200      # tối đa 2 giờ; âm thanh tự chia đoạn để nhận dạng ổn định
  max_upload_bytes: 1073741824 # 1 GiB cho file upload và tải từ URL
  max_queue_length: 20
  allowed_domains: [youtube.com, youtu.be, youtube-nocookie.com]
  guest_url_ingest_enabled: false # Chỉ bật sau khi đã xác nhận egress firewall

limits:
  guest:
    max_upload_bytes: 104857600
    max_duration_s: 900
    max_active_jobs: 1
    max_jobs_per_day: 3
  user:
    max_upload_bytes: 1073741824
    max_duration_s: 7200
    max_active_jobs: 2
    max_jobs_per_day: 20

asr:
  engine: faster-whisper
  # Nếu tên "large-v3-turbo" báo lỗi với bản faster-whisper của bạn, thử
  # "deepdml/faster-whisper-large-v3-turbo-ct2" hoặc "large-v3".
  model: large-v3-turbo
  device: cuda
  compute_type: float16      # nếu thiếu VRAM: int8_float16
  language: vi
  vad_filter: true
  beam_size: 5
  condition_on_previous_text: false
  segment_duration_s: 900   # nhận dạng từng phần 15 phút, mốc thời gian vẫn tính theo video gốc
  initial_prompt: ""         # để trống làm baseline; thử thuật ngữ chuyên ngành như một thí nghiệm riêng
  unload_ollama_first: true  # trước khi chạy ASR, bảo Ollama nhả model khỏi VRAM (tránh OOM khi hai bên cùng dùng GPU 8GB)

frames:                      # dò phân cảnh và lấy frame cho OCR/VLM; cần video local
  scene_threshold: 27.0      # ngưỡng ContentDetector của PySceneDetect (thấp hơn = nhạy hơn)
  frame_skip: 4              # xử lý 1/5 frame để tăng tốc; cảnh rất ngắn có thể bị bỏ qua
  interval_s: 8              # lấy mẫu định kỳ, bù cho cảnh gõ code liên tục không có "cắt cảnh"
  scene_offset_s: 1.0        # lấy frame sau đầu cảnh một chút để tránh frame đang chuyển
  min_gap_s: 2.0
  hash_dist: 4               # lọc frame trùng (dHash, số bit khác); đếm số frame còn lại rồi chỉnh
  max_frames: 2000
  max_width: 1280
  workers: 6                 # số ffmpeg trích frame song song (máy 20 luồng; để dư CPU cho server/Ollama)

ocr:
  enabled: true              # job ingest tự chạy frames → OCR sau ASR; false để ingest nhanh hơn
  python: .venv-vlm/bin/python   # chạy chung venv với VLM (torch CUDA); để trống = chạy trong venv hiện tại
  timeout_s: 3600            # giới hạn thời gian cho một lần chạy OCR (giây)
  engine: easyocr            # đọc đủ dấu tiếng Việt; PaddleOCR thiếu chữ hai dấu (ấ, ữ, ệ…)
  lang: [vi, en]             # song ngữ: chữ Việt trên slide + từ khoá code tiếng Anh
  device: gpu
  batch_size: 8              # số vùng chữ nhận dạng mỗi lượt trên GPU
  max_frames: 2000
  score_threshold: 0.4       # bỏ từ có độ tin cậy thấp trước khi ghép dòng (EasyOCR chấm điểm thấp hơn Paddle)
  unload_ollama_first: true

vlm:                         # mô tả sơ đồ/hình; chạy sau OCR, chỉ trên frame ít chữ
  enabled: true              # job ingest tự chạy VLM sau OCR; false để ingest nhanh hơn
  python: .venv-vlm/bin/python   # venv riêng chứa torch CUDA + transformers (xem README)
  timeout_s: 3600
  model: Qwen/Qwen2.5-VL-3B-Instruct
  device: cuda
  load_in_4bit: true         # ~3 GB VRAM thay vì ~7 GB; vừa GPU 8 GB cùng phần dư cho ảnh
  max_new_tokens: 96
  max_frames: 120            # tối đa sau khi lọc, rải đều cả bài giảng
  max_text_area: 0.15        # bỏ frame mà chữ chiếm ≥15% diện tích (slide/code: OCR đã đủ)
  min_hash_dist: 10          # bỏ frame gần giống frame đã chọn (dHash; frames.hash_dist là 4)
  max_pixels: 602112         # thu ảnh về ≤ ~1024×588 trước khi đưa vào model: ít token ảnh hơn, nhanh hơn
  unload_ollama_first: true

chunk:
  window_s: 50
  overlap_s: 10
  min_chars: 20
  use_screen_text: true      # index các file screen_text.json (OCR) và captions.json (VLM) nếu có
  screen_text_filter:        # lọc chữ rác OCR lúc lập chỉ mục; screen_text.json gốc giữ nguyên
    enabled: true
    frequent_ratio: 0.3      # một từ là "phổ biến" nếu có mặt ở ≥30% số frame (đã lọc trùng) của video
    frequent_share: 0.6      # dòng là rác nếu ≥60% số từ của nó là từ phổ biến
    top_band: 0.25           # ...và nằm ở 25% phía trên (menu, thanh công cụ)
    bottom_band: 0.1         # ...hoặc 10% phía dưới màn hình (watermark, thanh trạng thái)
    min_frames: 20           # video ít frame hơn thì không lọc theo tần suất
    drop_long_numbers: true  # bỏ dòng có dãy ≥9 chữ số (mã số sinh viên trong khung chat)

embedding:
  model: intfloat/multilingual-e5-small
  query_prefix: "query: "
  passage_prefix: "passage: "
  device: cpu                # cpu để khỏi tranh VRAM với LLM; đo rồi mới đổi
  batch_size: 32
  max_seq_length: 512

retrieval:
  mode: hybrid_graph         # kết hợp vector + BM25 + truy xuất đồ thị bằng RRF
  top_k: 5
  candidate_k: 20
  rrf_k: 60
  min_vector_score: null     # ví dụ 0.80; để null cho đến khi bạn tự đo phân bố điểm

knowledge_graph:
  link_threshold: 0.72       # ngưỡng khởi đầu; cần điều chỉnh bằng dữ liệu và bộ câu hỏi thật
  max_links_per_section: 2
  extract_relations: true    # Ollama trích quan hệ kèm câu bằng chứng khi dựng graph
  max_relation_chunks: 24    # tối đa 12 đoạn video + 12 mục tài liệu gửi qua Ollama mỗi lần lập chỉ mục

llm:
  base_url: http://localhost:11434   # Ollama local; đổi bằng VSKR__LLM__BASE_URL nếu cần
  model: qwen3.5:4b             # mặc định nhẹ hơn cho máy 24 GB RAM; 9b vẫn có thể chọn lại
  temperature: 0.1
  num_ctx: 4096
  keep_alive: 30s              # nhả RAM/VRAM sớm sau khi trả lời
  timeout_s: 300
