# Cách dùng chi tiết: README.md, mục "Chạy bằng Docker".
# MVP hiện cấu hình cho GPU NVIDIA; xem README nếu cần chuyển ASR sang CPU.
name: vskr

services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  vskr:
    build:
      context: .
      dockerfile: docker/Dockerfile.core
    image: vskr:local
    # Chạy bằng uid/gid của bạn (xem `id -u`, `id -g`; mặc định 1000) để file trong ./data không thuộc root.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    depends_on:
      ollama:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      VSKR__LLM__BASE_URL: http://ollama:11434
      VSKR__PATHS__DATA_DIR: /app/data
    volumes:
      - ./data:/app/data       # video, transcript, chỉ mục: nằm ngoài ảnh nên xóa container không mất
      - ./cache:/cache         # model Whisper/E5 tải từ Hugging Face, cache yt-dlp
      - ./configs:/app/configs # sửa models.yaml không cần build lại image
      - ./backend/src:/app/backend/src # phát triển code không cần build lại image
      - ./web:/app/web
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  ollama:
